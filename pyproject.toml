[project]
name = "rlm-logistics"
version = "0.1.0"
description = "Benchmarking Recursive Language Models vs RAG vs direct LLM calls on Olist delivery data"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "kaggle>=1.7",
]

[dependency-groups]
dev = ["jupyter>=1.0", "ipykernel>=6.29", "nbconvert>=7.16", "pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm_logistics"]
