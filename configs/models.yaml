# Model roles, read by LLM.from_config(role). price / long_price: $ per 1M (input, output) tokens;
# long_price applies to prompts above 100K tokens. Exact final versions are pinned before Phase 5.
dev:
  provider: ollama
  model: qwen3:8b
  num_ctx: 16384
dev_backup:
  provider: openrouter
  model: null        # pick a ":free" model if qwen is too slow or weak
labeler:
  provider: anthropic
  model: claude-haiku-5-5   # labels were made through the Batch API at half these prices
  price: [0.10, 0.50]
  long_price: [0.50, 2.50]
final:
  provider: anthropic
  model: claude-haiku-5-5   # pinned 2026-10-15 for the Phase 5 grid
  num_ctx: 50000            # largest prompt an RLM sub-call may send (~90K characters, ~360 records)
  price: [0.10, 0.50]
  long_price: [0.50, 2.50]
